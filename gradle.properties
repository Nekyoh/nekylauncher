# Azure application (client) ID approved by Mojang for the Minecraft API.
# Put it here (or set the NEKY_MS_CLIENT_ID environment variable / GitHub secret) and every
# build of NekyLauncher will sign in with Microsoft in one click - users never see this ID.
msClientId=

# CurseForge API key (console.curseforge.com). Prefer the NEKY_CF_API_KEY env var / GitHub secret.
cfApiKey=
